[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsumugi"
version = "0.1.0.dev0"
description = "Local-first context infrastructure for generative AI. Select what bears on the question, keep the evidence attached, and say what was left out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nananananana" }]
keywords = ["context", "rag", "evidence", "provenance", "llm", "local-first", "japanese"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

# Zero. Not "few". See docs/adr/0001-the-domain-depends-on-nothing.md -- this
# library reads a person's entire notes folder, and every runtime dependency is
# code with unsupervised read access to it.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6.90",
    "ruff>=0.16",
    "mypy>=1.10",
    "import-linter>=2",
    "pre-commit",
    # Validates real packages against the published contract. There is no
    # pydantic in the core (ADR-0001), so the schema and the dataclasses are
    # kept in step by a test rather than derived from one another.
    "jsonschema>=4",
]

# There is deliberately no `siblings` extra. There was one -- `mamori>=0.14` --
# and no resolver on earth could satisfy it, because mamori is not on PyPI:
#
#   ERROR: Could not find a version that satisfies the requirement mamori>=0.14
#          (from versions: none)
#
# It was never used. CI installs the sibling from git and says why. So the
# extra was a published instruction that failed for anyone who followed it --
# this project's own failure class, in its own packaging metadata.
#
# **Do not "fix" it with a direct reference.** This is the trap, and it closes
# quietly:
#
#   siblings = ["mamori @ git+https://github.com/Nananananana/mamori.git"]
#
# hatchling refuses that at build time -- and its error message tells you to
# set `allow-direct-references`, after which the build succeeds and `twine
# check` reports PASSED. What it does not tell you is that PyPI rejects a
# `requires_dist` direct URL with a 400, so the distribution becomes
# unpublishable while every local check goes green. `tests/test_packaging.py`
# refuses the direct reference for that reason.
#
# To develop against a sibling, install it the way CI does:
#
#   pip install "mamori @ git+https://github.com/Nananananana/mamori@main"

[project.urls]
Homepage = "https://github.com/Nananananana/tsumugi"
Repository = "https://github.com/Nananananana/tsumugi"
Issues = "https://github.com/Nananananana/tsumugi/issues"
Changelog = "https://github.com/Nananananana/tsumugi/blob/main/CHANGELOG.md"

[project.scripts]
tsumugi = "tsumugi.interfaces.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsumugi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "S", "RUF"]
ignore = [
    "S101",   # assert: this is a test suite convention
    # Full-width and CJK characters are the subject matter, not a typo. Half of
    # the indexing logic exists because FTS5's default tokenizer turns a whole
    # Japanese sentence into one token, so both forms appear in code, docstrings
    # and fixtures on purpose. See ADR-0007.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
files = ["src/tsumugi"]
strict = true
warn_unreachable = true

# The siblings are optional and the lint job installs `[dev]` without them, so
# mypy cannot find them there and said so -- for nine commits, behind a Ruff
# failure that stopped the job before it got this far. Scoped to these two
# modules rather than set globally: a missing import is a real error
# everywhere else, and this says *which* imports are allowed to be absent.
#
# Where a sibling *is* installed -- a developer's machine, the siblings job --
# mypy still type-checks against the real thing. `ignore_missing_imports` only
# governs what happens when the module cannot be found at all.
[[tool.mypy.overrides]]
module = ["mamori.*", "mamori", "kiseki.*", "kiseki"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/tsumugi"]
