[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsumugi"
version = "0.1.0.dev0"
description = "Local-first context infrastructure for generative AI. Select what bears on the question, keep the evidence attached, and say what was left out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nananananana" }]
keywords = ["context", "rag", "evidence", "provenance", "llm", "local-first", "japanese"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

# Zero. Not "few". See docs/adr/0001-the-domain-depends-on-nothing.md -- this
# library reads a person's entire notes folder, and every runtime dependency is
# code with unsupervised read access to it.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6.90",
    "ruff>=0.16",
    "mypy>=1.10",
    "import-linter>=2",
    "pre-commit",
    # Validates real packages against the published contract. There is no
    # pydantic in the core (ADR-0001), so the schema and the dataclasses are
    # kept in step by a test rather than derived from one another.
    "jsonschema>=4",
    # Stubs, so the conformance suite type-checks like everything else.
    "types-jsonschema",
    # The two libraries `interop` claims to speak. Nothing in `src/` imports
    # them; they are here so the *claim* is tested against the real classes
    # rather than against this repository's idea of them. `Document` and
    # `TextNode` are other people's shapes, and other people change shapes.
    "langchain-core>=0.3",
    "llama-index-core>=0.12",
]

# Optional, and every one of them is outside the core. The domain imports
# nothing but the standard library and an architecture test enforces that
# (ADR-0001); these live in `infrastructure/` and `tools/`, which is the layer
# an external library is allowed to reach.
#
# **None of them is installed by default and none is required.** `tsumugi`
# works with none of them, which is what makes them extras rather than
# dependencies -- and what each one is *worth here* is measured in
# `docs/measurements.md` rather than assumed from what it does elsewhere.
research = [
    # Cross-encoder reranking and ONNX embeddings, without torch.
    "fastembed>=0.4",
    # Japanese morphology. Pure Python, dictionary bundled.
    "janome>=0.5",
    # Chinese word segmentation.
    "jieba>=0.42",
]

# There is deliberately no `siblings` extra. There was one -- `mamori>=0.14` --
# and no resolver on earth could satisfy it, because mamori is not on PyPI:
#
#   ERROR: Could not find a version that satisfies the requirement mamori>=0.14
#          (from versions: none)
#
# It was never used. CI installs the sibling from git and says why. So the
# extra was a published instruction that failed for anyone who followed it --
# this project's own failure class, in its own packaging metadata.
#
# **Do not "fix" it with a direct reference.** This is the trap, and it closes
# quietly:
#
#   siblings = ["mamori @ git+https://github.com/Nananananana/mamori.git"]
#
# hatchling refuses that at build time -- and its error message tells you to
# set `allow-direct-references`, after which the build succeeds and `twine
# check` reports PASSED. What it does not tell you is that PyPI rejects a
# `requires_dist` direct URL with a 400, so the distribution becomes
# unpublishable while every local check goes green. `tests/test_packaging.py`
# refuses the direct reference for that reason.
#
# To develop against a sibling, install it the way CI does:
#
#   pip install "mamori @ git+https://github.com/Nananananana/mamori@main"

[project.urls]
Homepage = "https://github.com/Nananananana/tsumugi"
Repository = "https://github.com/Nananananana/tsumugi"
Issues = "https://github.com/Nananananana/tsumugi/issues"
Changelog = "https://github.com/Nananananana/tsumugi/blob/main/CHANGELOG.md"

[project.scripts]
tsumugi = "tsumugi.interfaces.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsumugi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# An empty `parametrize` list is a *skip* by default, and a skip is green. Five
# architecture tests parametrize over every module under `src`, so a renamed
# package or a typo in the glob would turn the whole layer table into a row of
# skips that nobody reads. `ALL_MODULES` already asserts it is non-empty; this
# is the general form, from `iriguchi`, and it covers the next parametrize as
# well as the five that exist.
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "S", "RUF"]
ignore = [
    "S101",   # assert: this is a test suite convention
    # Full-width and CJK characters are the subject matter, not a typo. Half of
    # the indexing logic exists because FTS5's default tokenizer turns a whole
    # Japanese sentence into one token, so both forms appear in code, docstrings
    # and fixtures on purpose. See ADR-0007.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
# Everything: `src`, `tools` and `tests`. A checker narrower than the thing it
# protects fails silently by construction (mamori's CONTRIBUTING), measured
# across six repositories by `iriguchi`, which found its own corpus generator
# unchecked. This was `["src/tsumugi"]` -- 74 of 114 files -- and widening it
# found that the library shipped without a PEP 561 marker, so every consumer's
# checker skipped it entirely.
#
# `tests/` came in last and cost 33 errors. Nine were `type: ignore` comments
# that stopped being needed the moment `py.typed` existed. Three were real: the
# example parsers in `test_parsers.py` demonstrated that "a new format needs no
# change to the library" with classes that did not satisfy the `Parser`
# protocol, so the test claimed an extensibility a typed user would not get.
files = ["src/tsumugi", "tools", "tests"]
# `tools/` is on the path for the tests that import the gate runner and the
# seam fixture builder; mypy needs the same path to resolve them.
mypy_path = ["tools"]
strict = true
warn_unreachable = true

# The siblings are optional and the lint job installs `[dev]` without them, so
# mypy cannot find them there and said so -- for nine commits, behind a Ruff
# failure that stopped the job before it got this far. Scoped to these two
# modules rather than set globally: a missing import is a real error
# everywhere else, and this says *which* imports are allowed to be absent.
#
# Where a sibling *is* installed -- a developer's machine, the siblings job --
# mypy still type-checks against the real thing. `ignore_missing_imports` only
# governs what happens when the module cannot be found at all.
[[tool.mypy.overrides]]
module = [
    "mamori.*",
    "mamori",
    "kiseki.*",
    "kiseki",
    "janome.*",
    "jieba",
    "fastembed.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/tsumugi"]
