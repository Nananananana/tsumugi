name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # FTS5 is an optional SQLite compile-time feature and the whole search
      # layer depends on it (ADR-0007). If a runner ships a build without it,
      # the failure should name that rather than surfacing as forty confusing
      # test failures.
      - name: Check the SQLite build
        run: python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('CREATE VIRTUAL TABLE t USING fts5(x)'); print('fts5 ok', sqlite3.sqlite_version)"

      - name: Test
        run: python -m pytest --cov=tsumugi --cov-report=term-missing
        env:
          PYTHONUTF8: "1"

      # The labelled corpus, on the fast tier. It measures selection against
      # cases with known answers; the numbers are in docs/measurements.md.
      - name: Evaluate
        run: python -m tsumugi.interfaces.cli.main eval --tier ci
        env:
          PYTHONUTF8: "1"

  lint:
    name: lint, types and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check . && python -m ruff format --check .

      - name: Types
        run: python -m mypy

      # The layering is a gate, not a guideline. ADR-0001.
      - name: Layering
        run: lint-imports

      # A generated case that is broken fails a *correct* implementation, so
      # the oracle runs on every push rather than only when cases are written.
      - name: Check the evaluation fixtures
        run: python tools/generate_cases.py --out tests/cases --check-only

  siblings:
    name: integration with mamori
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # mamori is not on PyPI, so `pip install ".[siblings]"` could never
      # resolve it -- and with `continue-on-error` on the *job*, the install
      # failure was swallowed and this job reported success without ever
      # having run. It had never run. Found by `iriguchi`, which inspected
      # this job before copying it.
      #
      # Installed from git here rather than declared in the extra: a PEP 508
      # direct reference in `pyproject.toml` makes the project unpublishable
      # to PyPI, and the extra is part of what tsumugi ships.
      - name: Install the sibling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mamori @ git+https://github.com/Nananananana/mamori@main"
          python -m pip install -e ".[dev]"

      # Setup failing is not the same finding as the seam failing, and only
      # one of them is allowed to be quiet. If mamori is not importable here,
      # every test in the file below skips itself and pytest reports success
      # over zero tests -- the silent-skip shape, one level up from the
      # `importorskip` this repository removed from its contract suite.
      # `import mamori` proves a module of that name imports, not that it is
      # ours. It is free on PyPI today so nothing can go wrong here yet -- but
      # `tsumugi`, `musubi` and `akashi` are all taken by unrelated real
      # projects, so the same guard copied to a sibling would pass on a
      # stranger's package. Found by `seam`.
      #
      # PEP 610 answers it: anything installed from a URL or a path leaves a
      # `direct_url.json`, and a PyPI install leaves none.
      - name: Assert the sibling is actually ours
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import json

          raw = metadata.distribution("mamori").read_text("direct_url.json")
          assert raw, "mamori came from an index, not from the repository we asked for"
          direct = json.loads(raw)
          assert "Nananananana/mamori" in direct["url"], direct["url"]
          commit = (direct.get("vcs_info") or {}).get("commit_id", "unknown")
          print(f"mamori from {direct['url']} at {commit}")
          PY

      # ADR-0009's restore-before-verify property, against the real redactor
      # rather than a fake written to make the point.
      #
      # `continue-on-error` belongs *here*, on the step, and not on the job: a
      # sibling's release should tell us rather than turn an unrelated merge
      # red. If mamori's releases ever start doing that in earnest, the lever
      # is pinning the checkout to a ref -- not tolerance.
      - name: The seam
        run: python -m pytest tests/test_adapter_mamori.py -q
        continue-on-error: true
        env:
          PYTHONUTF8: "1"

  dependencies:
    name: the dependency count is zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The README promises `pip install tsumugi` installs one thing. A promise
      # in a README decays; this one is checked on every push. Installing
      # without [dev] into a clean environment must pull in nothing at all.
      - name: Install with no extras
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Assert nothing came with it
        run: |
          python - <<'PY'
          import importlib.metadata as md
          installed = {d.metadata["Name"].lower() for d in md.distributions()}
          # pip and its own bootstrap packaging are part of the environment,
          # not of tsumugi.
          allowed = {"tsumugi", "pip", "setuptools", "wheel", "packaging"}
          extra = sorted(installed - allowed)
          assert not extra, f"tsumugi pulled in runtime dependencies: {extra}"
          print("runtime dependencies:", len(extra))
          PY

      # And the other half of that promise: the contract ships *inside* the
      # package, so a consumer validating a ContextPackage does not have to
      # fetch a schema from the internet. This step is the only place that
      # proves it -- the test suite runs against an editable install, where
      # the file is on disk whether it was packaged or not.
      - name: Assert the contract shipped with it
        run: |
          cd "${{ runner.temp }}"
          python - <<'PY'
          import tsumugi
          schema = tsumugi.contract_schema()
          assert schema["$defs"]["item"]["type"] == "object", schema
          print("contract:", tsumugi.CONTRACT_SCHEMA_NAME, len(tsumugi.contract_schema_text()), "bytes")
          PY
